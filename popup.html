<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotifiee</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18V5L21 3V16" stroke="#1DB954" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="18" r="3" fill="#1DB954"/>
            <circle cx="18" cy="16" r="3" fill="#1DB954"/>
            <path d="M9 10L21 8" stroke="#1DB954" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Spotifiee</h1>
          <span class="sub">Music Ad Blocker</span>
        </div>
      </div>
      <div id="status-pill" class="status-pill status-ready">
        <span class="status-dot"></span>
        <span id="status-text">Checking...</span>
      </div>
    </header>

    <!-- Stats Section -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🛡️</div>
        <div class="stat-info">
          <span class="stat-value" id="ads-count">0</span>
          <span class="stat-label">Ads Blocked</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏱️</div>
        <div class="stat-info">
          <span class="stat-value" id="time-saved">0s</span>
          <span class="stat-label">Time Saved</span>
        </div>
      </div>
    </section>

    <!-- Features / Settings Toggles -->
    <section class="settings-section">
      <h2 class="section-title">Protection Controls</h2>

      <div class="setting-item">
        <div class="setting-icon">⚡</div>
        <div class="setting-info">
          <label for="toggle-skip" class="setting-title">Auto-Skip Ads</label>
          <span class="setting-desc">Fast-forward and skip ads smoothly</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-skip">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-icon">🔇</div>
        <div class="setting-info">
          <label for="toggle-mute" class="setting-title">Auto-Mute Ads</label>
          <span class="setting-desc">Silence audio playback during ads</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-mute">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-icon">🚫</div>
        <div class="setting-info">
          <label for="toggle-banners" class="setting-title">Block Banners</label>
          <span class="setting-desc">Remove visual promos & upgrade popups</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-banners">
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-item">
        <div class="setting-icon">🔔</div>
        <div class="setting-info">
          <label for="toggle-toast" class="setting-title">In-Player Toast</label>
          <span class="setting-desc">Show notification pill on Spotify UI</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-toast">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- Launch / Controls Footer -->
    <footer class="popup-footer">
      <button id="open-spotify-btn" class="btn-spotify">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.48.66.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
        <span>Open Spotify Web</span>
      </button>

      <div class="footer-links">
        <button id="reset-stats-btn" class="link-btn">Reset Statistics</button>
        <span class="divider">•</span>
        <span class="version-tag">v1.7.0</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
